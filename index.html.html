<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>المجلس</title>
<style>
:root{--bg:#fff;--panel:#fff;--soft:#f5f6f8;--gold:#b9862d;--gold2:#d8a84e;--text:#111;--muted:#6f7780;--red:#a12630;--blue:#245da8;--line:#e3e6e9}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
button,input{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.screen{display:none}.screen.active{display:block}.brand{text-align:center;padding:45px 0 25px}.brand .mark{font-size:68px}.brand h1{font-size:60px;margin:4px;color:var(--gold)}.brand p{color:#555}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 8px 24px #0000000d}
.btn{width:100%;border:1px solid #d2d6db;border-radius:13px;padding:15px;margin:7px 0;background:#fff;color:#111;font-weight:800}.btn.gold{background:linear-gradient(#f4d693,#d5a345);color:#16110a;border:0}.btn.red{background:#fff3f4;border-color:#e5b5ba}.btn.blue{background:#f2f7ff;border-color:#b7cae6}
h2{text-align:center;color:#111}label{display:block;color:#8b651f;margin:14px 3px 6px}.input{width:100%;padding:14px;border-radius:12px;border:1px solid #ccd1d7;background:#fff;color:#111}
.categories{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cat{min-height:78px;padding:10px;border:1px solid #d8dce1;border-radius:14px;background:#fff;color:#111;display:flex;align-items:center;gap:10px;text-align:right}.cat.sel{border:2px solid var(--gold);background:#fff8ea}.catIcon{width:42px;height:42px;border-radius:50%;background:#f1f2f4;display:grid;place-items:center;font-size:24px;flex:0 0 42px}.catName{font-weight:800;line-height:1.25}
.counter{text-align:center;color:var(--gold);font-weight:900;margin:8px}.scorebar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:12px}.teamScore{border-radius:12px;padding:10px;text-align:center;font-weight:900}.teamScore.red{background:#fff0f1;border:1px solid #e6b0b5}.teamScore.blue{background:#eef5ff;border:1px solid #b7cae5}.logo{text-align:center;color:var(--gold);font-size:22px;font-weight:900}
.board{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.categoryBox{border:1px solid #ddd2bc;border-radius:14px;padding:8px;background:#fff}.categoryHead{display:flex;align-items:center;gap:7px;justify-content:center;min-height:45px}.categoryHead .mini{font-size:23px}.categoryBox h3{text-align:center;font-size:14px;margin:4px;color:#111}.points{display:grid;grid-template-columns:1fr 1fr;gap:5px}.point{padding:10px 3px;border:1px solid #d2bd94;border-radius:8px;background:#fffaf0;color:#8c6218;font-weight:900}.point.used{opacity:.28;text-decoration:line-through}
.question{font-size:25px;line-height:1.7;text-align:center;padding:24px 8px;color:#111;font-weight:750}.timer{width:126px;height:126px;border:8px solid #c84047;border-radius:50%;display:grid;place-items:center;margin:20px auto;font-size:30px;font-weight:900;color:#111}.timer.steal{border-color:#3477c8}.answer{text-align:center;font-size:28px;color:#7e5715;font-weight:900;padding:18px}.hidden{display:none}.small{color:var(--muted);text-align:center}.winner{text-align:center;padding:35px 0}.trophy{font-size:76px}.winnerName{font-size:34px;color:var(--gold);font-weight:900}.topline{display:flex;justify-content:space-between;align-items:center}.badge{color:#8a631e;font-weight:900}
.players{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:16px 0}.player{width:96px;text-align:center}.avatar{width:86px;height:86px;border-radius:50%;overflow:hidden;background:#eef0f3;border:3px solid #e1c078;margin:auto;display:grid;place-items:center;font-size:32px}.avatar img{width:100%;height:100%;object-fit:cover}.playerName{font-size:12px;margin-top:6px;color:#222;font-weight:700}
.note{font-size:12px;color:#777;text-align:center;margin-top:12px}
@media(min-width:620px){.categories{grid-template-columns:repeat(3,1fr)}.board{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body><main class="app">
<section id="home" class="screen active"><div class="brand"><div class="mark">🏮</div><h1>المجلس</h1><p>مسابقة المعرفة</p></div><button class="btn gold" onclick="show('teams')">⚔️ ابدأ مجلس جديد</button><div class="card small">نسخة تجريبية محدثة • خلفية بيضاء • فئات موسعة</div></section>
<section id="teams" class="screen"><h2>أسماء الفريقين</h2><div class="card"><label>الفريق الأول</label><input id="t1" class="input" value="فريق فهد"><label>الفريق الثاني</label><input id="t2" class="input" value="فريق مشعل"></div><button class="btn gold" onclick="toCategories()">التالي</button></section>
<section id="cats" class="screen"><div class="topline"><h2>اختيار الفئات</h2><span id="cc" class="badge">0 / 6</span></div><p class="small">اختر 6 فئات</p><div id="catGrid" class="categories"></div><button id="startBtn" class="btn gold" disabled onclick="draw()">ابدأ اللعبة</button></section>
<section id="draw" class="screen"><h2>القرعة</h2><div class="card winner"><div class="trophy">🎲</div><p>الفريق الذي يبدأ هو</p><div id="starter" class="winnerName"></div></div><button class="btn gold" onclick="startGame()">ابدأ المباراة</button></section>
<section id="boardScreen" class="screen"><div class="logo">المجلس</div><div class="scorebar"><div id="s2" class="teamScore red"></div><div>⚔️</div><div id="s1" class="teamScore blue"></div></div><div id="board" class="board"></div></section>
<section id="questionScreen" class="screen"><div class="topline"><span id="qCat" class="badge"></span><span id="qPts" class="badge"></span></div><div id="playerArea" class="players hidden"></div><div id="qText" class="question"></div><div id="timer" class="timer">00:30</div><p id="turnText" class="small"></p><button id="answerBtn" class="btn" onclick="reveal()">👁 إظهار الجواب</button><div id="answerArea" class="hidden"><div class="small">الإجابة الصحيحة</div><div id="answer" class="answer"></div><p class="small">من حصل على النقاط؟</p><button id="give1" class="btn blue" onclick="award(1)"></button><button id="give2" class="btn red" onclick="award(2)"></button><button class="btn" onclick="award(0)">لا أحد</button></div></section>
<section id="result" class="screen"><div class="winner"><div class="trophy">🏆</div><p>الفائز</p><div id="winnerName" class="winnerName"></div><div id="finalScores" class="card"></div></div><button class="btn gold" onclick="location.reload()">مجلس جديد</button><div class="note">الأسئلة المستخدمة تحفظ على هذا الجهاز لمنع تكرارها.</div></section>
</main>
<script>
const categories=[{"name": "معلومات عامة", "icon": "🧠"}, {"name": "تاريخ", "icon": "🏺"}, {"name": "تاريخ إسلامي", "icon": "🕌"}, {"name": "قصص الأنبياء", "icon": "📜"}, {"name": "قصص القرآن", "icon": "📖"}, {"name": "جغرافيا", "icon": "🌍"}, {"name": "أعلام دول", "icon": "🏳️"}, {"name": "نشيد وطني", "icon": "🎵"}, {"name": "من هو اللاعب", "icon": "⚽"}, {"name": "مسيرة لاعب", "icon": "🛣️"}, {"name": "النادي المشترك", "icon": "🤝"}, {"name": "الدوري الإنجليزي", "icon": "🏴"}, {"name": "دوري الأبطال", "icon": "🏆"}, {"name": "كأس العالم", "icon": "🌐"}, {"name": "تشكيلات فرق", "icon": "🧩"}, {"name": "عالم الحيوان", "icon": "🦁"}, {"name": "صحح الخطأ", "icon": "✏️"}, {"name": "معارك وحروب", "icon": "⚔️"}, {"name": "خمن الدولة", "icon": "🗺️"}, {"name": "السيرة النبوية", "icon": "🌙"}, {"name": "من سجل الهدف", "icon": "🥅"}, {"name": "تاريخ الخلفاء", "icon": "👑"}, {"name": "تاريخ الصحابة", "icon": "⭐"}, {"name": "القرآن الكريم", "icon": "📗"}, {"name": "رؤساء دول", "icon": "🏛️"}, {"name": "ألغاز", "icon": "🧩"}, {"name": "حروف اسلامي", "icon": "🔤"}, {"name": "اغاني عربية", "icon": "🎶"}, {"name": "افلام اجنبية", "icon": "🎬"}, {"name": "مسلسلات عربية", "icon": "📺"}, {"name": "مانشستر يونايتد", "icon": "🔴"}, {"name": "ريال مدريد", "icon": "⚪"}, {"name": "برشلونة", "icon": "🔵"}, {"name": "الكلاسيكو", "icon": "🔥"}, {"name": "قطر", "icon": "🇶🇦"}, {"name": "سوريا", "icon": "🇸🇾"}];
const bank={"معلومات عامة": [{"id": "gen_1", "question": "ما العنصر الكيميائي الذي رمزه Fe؟", "answer": "الحديد", "points": 100}], "تاريخ": [{"id": "his_1", "question": "أي حضارة بنت مدينة ماتشو بيتشو؟", "answer": "حضارة الإنكا", "points": 300}], "تاريخ إسلامي": [{"id": "ih_1", "question": "من أول الخلفاء الراشدين؟", "answer": "أبو بكر الصديق", "points": 100}], "قصص الأنبياء": [{"id": "prop_1", "question": "أي نبي ابتلعه الحوت؟", "answer": "يونس عليه السلام", "points": 100}], "قصص القرآن": [{"id": "qstory_1", "question": "في أي سورة وردت قصة أصحاب الكهف؟", "answer": "سورة الكهف", "points": 100}], "جغرافيا": [{"id": "geo_1", "question": "ما عاصمة أستراليا؟", "answer": "كانبرا", "points": 300}], "أعلام دول": [{"id": "flag_1", "question": "أي دولة علمها يحمل ورقة قيقب حمراء؟", "answer": "كندا", "points": 100}], "نشيد وطني": [{"id": "anthem_1", "question": "ما الدولة التي يُعرف نشيدها الوطني باسم لا مارسييز؟", "answer": "فرنسا", "points": 300}], "من هو اللاعب": [{"id": "who_1", "question": "من اللاعب الملقب بالظاهرة؟", "answer": "رونالدو نازاريو", "points": 100}], "مسيرة لاعب": [{"id": "career_1", "question": "لعب لأياكس ويوفنتوس وإنتر وبرشلونة وميلان وباريس سان جيرمان. من هو؟", "answer": "زلاتان إبراهيموفيتش", "points": 300}], "النادي المشترك": [{"id": "club_1", "question": "ما النادي المشترك بين هؤلاء اللاعبين؟", "answer": "مانشستر يونايتد", "points": 300, "players": [{"name": "كريستيانو رونالدو", "img": ""}, {"name": "واين روني", "img": ""}, {"name": "ديفيد بيكهام", "img": ""}]}], "الدوري الإنجليزي": [{"id": "epl_1", "question": "أي نادٍ حقق أول لقب في حقبة البريميرليغ 1992-93؟", "answer": "مانشستر يونايتد", "points": 100}], "دوري الأبطال": [{"id": "ucl_1", "question": "من فاز بدوري أبطال أوروبا عام 1999؟", "answer": "مانشستر يونايتد", "points": 100}], "كأس العالم": [{"id": "wc_1", "question": "من كان قائد إيطاليا عند الفوز بكأس العالم 2006؟", "answer": "فابيو كانافارو", "points": 300}], "تشكيلات فرق": [{"id": "lineup_1", "question": "من كان حارس إسبانيا الأساسي في نهائي كأس العالم 2010؟", "answer": "إيكر كاسياس", "points": 100}], "عالم الحيوان": [{"id": "animal_1", "question": "ما أكبر حيوان حي على الأرض؟", "answer": "الحوت الأزرق", "points": 100}], "صحح الخطأ": [{"id": "fix_1", "question": "صحح العبارة: فازت الأرجنتين بكأس العالم 2014.", "answer": "ألمانيا فازت بكأس العالم 2014", "points": 100}], "معارك وحروب": [{"id": "war_1", "question": "في أي عام انتهت الحرب العالمية الثانية؟", "answer": "1945", "points": 100}], "خمن الدولة": [{"id": "guess_1", "question": "دولة أوروبية عاصمتها لشبونة. ما هي؟", "answer": "البرتغال", "points": 100}], "السيرة النبوية": [{"id": "seera_1", "question": "إلى أي مدينة كانت الهجرة النبوية؟", "answer": "المدينة المنورة", "points": 100}], "من سجل الهدف": [{"id": "goal_1", "question": "من سجل هدف إسبانيا في نهائي كأس العالم 2010؟", "answer": "أندريس إنييستا", "points": 100}], "تاريخ الخلفاء": [{"id": "caliph_1", "question": "من الخليفة الراشدي الذي لُقّب بالفاروق؟", "answer": "عمر بن الخطاب", "points": 100}], "تاريخ الصحابة": [{"id": "sahaba_1", "question": "من الصحابي الملقب بسيف الله المسلول؟", "answer": "خالد بن الوليد", "points": 100}], "القرآن الكريم": [{"id": "quran_1", "question": "كم عدد سور القرآن الكريم؟", "answer": "114 سورة", "points": 100}], "رؤساء دول": [{"id": "pres_1", "question": "ما المسمى الرسمي لرئيس الحكومة في المملكة المتحدة؟", "answer": "رئيس الوزراء", "points": 100}], "ألغاز": [{"id": "riddle_1", "question": "شيء كلما أخذت منه كبر، ما هو؟", "answer": "الحفرة", "points": 100}], "حروف اسلامي": [{"id": "letters_1", "question": "اذكر اسم نبي يبدأ بحرف الياء.", "answer": "يوسف أو يونس أو يحيى", "points": 100}], "اغاني عربية": [{"id": "arabic_song_1", "question": "من غنّى أغنية «تملي معاك»؟", "answer": "عمرو دياب", "points": 100}], "افلام اجنبية": [{"id": "movie_1", "question": "في أي سلسلة أفلام يظهر عالم الآثار إنديانا جونز؟", "answer": "Indiana Jones", "points": 100}], "مسلسلات عربية": [{"id": "series_1", "question": "ما اسم المسلسل السوري الشهير الذي تدور أحداثه في حارة دمشقية قديمة؟", "answer": "باب الحارة", "points": 100}], "مانشستر يونايتد": [{"id": "mufc_1", "question": "ما لقب نادي مانشستر يونايتد الشهير؟", "answer": "الشياطين الحمر", "points": 100}], "ريال مدريد": [{"id": "rm_1", "question": "ما الملعب التاريخي لريال مدريد؟", "answer": "سانتياغو برنابيو", "points": 100}], "برشلونة": [{"id": "barca_1", "question": "ما اسم أكاديمية برشلونة الشهيرة؟", "answer": "لا ماسيا", "points": 100}], "الكلاسيكو": [{"id": "clasico_1", "question": "ما الفريقان اللذان يخوضان مباراة الكلاسيكو في إسبانيا؟", "answer": "ريال مدريد وبرشلونة", "points": 100}], "قطر": [{"id": "qatar_1", "question": "ما عاصمة دولة قطر؟", "answer": "الدوحة", "points": 100}], "سوريا": [{"id": "syria_1", "question": "ما عاصمة سوريا؟", "answer": "دمشق", "points": 100}]};
const usedKey="almajlis_used_v2";
let selected=[],team1="",team2="",score1=0,score2=0,current=null,timerId=null,time=30,steal=false,usedCount=0;
let usedIds=new Set(JSON.parse(localStorage.getItem(usedKey)||"[]"));
const iconOf=n=>categories.find(x=>x.name===n)?.icon||"❓";
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)}
function toCategories(){team1=t1.value.trim()||"الفريق الأول";team2=t2.value.trim()||"الفريق الثاني";renderCats();show('cats')}
function renderCats(){catGrid.innerHTML="";categories.forEach(c=>{let b=document.createElement('button');b.className='cat'+(selected.includes(c.name)?' sel':'');b.innerHTML=`<span class="catIcon">${c.icon}</span><span class="catName">${c.name}</span>`;b.onclick=()=>{if(selected.includes(c.name))selected=selected.filter(x=>x!==c.name);else if(selected.length<6)selected.push(c.name);renderCats()};catGrid.appendChild(b)});cc.textContent=selected.length+" / 6";startBtn.disabled=selected.length!==6}
function draw(){starter.textContent=Math.random()<.5?team1:team2;show('draw')}
function startGame(){renderBoard();updateScores();show('boardScreen')}
function renderBoard(){board.innerHTML="";selected.forEach(c=>{let box=document.createElement('div');box.className='categoryBox';box.innerHTML=`<div class="categoryHead"><span class="mini">${iconOf(c)}</span><h3>${c}</h3></div><div class="points"></div>`;let p=box.querySelector('.points');[100,100,300,300,500,500].forEach((v,qi)=>{let b=document.createElement('button');b.className='point';b.textContent=v;b.dataset.used='0';b.onclick=()=>openQuestion(c,v,b,qi);p.appendChild(b)});board.appendChild(box)})}
function pickQuestion(cat,pts){let arr=(bank[cat]||[]).filter(q=>!usedIds.has(q.id) && (q.points===pts || !q.points));if(!arr.length) arr=(bank[cat]||[]).filter(q=>!usedIds.has(q.id));return arr[Math.floor(Math.random()*arr.length)]||null}
function openQuestion(cat,pts,btn,qi){if(btn.dataset.used==='1')return;let q=pickQuestion(cat,pts);if(!q){alert("لا توجد أسئلة جديدة كافية في هذه الفئة بعد. سيتم توسيع بنك الأسئلة في النسخة الكاملة.");return}current={cat,pts,btn,q};qCat.textContent=cat;qPts.textContent=pts+" نقطة";qText.textContent=q.question;answer.textContent=q.answer;renderPlayers(q.players||[]);answerArea.classList.add('hidden');answerBtn.classList.remove('hidden');steal=false;time=30;timer.classList.remove('steal');turnText.textContent="دور "+starter.textContent;show('questionScreen');runTimer()}
function renderPlayers(players){playerArea.innerHTML="";if(!players.length){playerArea.classList.add('hidden');return}playerArea.classList.remove('hidden');players.forEach(p=>{let d=document.createElement('div');d.className='player';let av=p.img?`<img src="${p.img}" alt="${p.name}">`:"👤";d.innerHTML=`<div class="avatar">${av}</div><div class="playerName">${p.name}</div>`;playerArea.appendChild(d)})}
function runTimer(){clearInterval(timerId);paintTimer();timerId=setInterval(()=>{time--;paintTimer();if(time<=0){clearInterval(timerId);if(!steal){steal=true;time=15;timer.classList.add('steal');let other=starter.textContent===team1?team2:team1;turnText.textContent="انتقل السؤال إلى "+other;runTimer()}else reveal()}},1000)}
function paintTimer(){timer.textContent="00:"+String(time).padStart(2,'0')}
function reveal(){clearInterval(timerId);answerArea.classList.remove('hidden');answerBtn.classList.add('hidden');give1.textContent=team1+" +"+current.pts;give2.textContent=team2+" +"+current.pts}
function award(n){if(n===1)score1+=current.pts;if(n===2)score2+=current.pts;usedIds.add(current.q.id);localStorage.setItem(usedKey,JSON.stringify([...usedIds]));current.btn.dataset.used='1';current.btn.classList.add('used');current.btn.textContent='✓';usedCount++;updateScores();if(usedCount>=36)finish();else show('boardScreen')}
function updateScores(){s1.textContent=team1+" "+score1;s2.textContent=team2+" "+score2}
function finish(){let w=score1===score2?"تعادل":score1>score2?team1:team2;winnerName.textContent=w;finalScores.innerHTML="<b>"+team1+": "+score1+"</b><br><br><b>"+team2+": "+score2+"</b>";show('result')}
</script></body></html>
