<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06111b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>المجلس</title>
<style>
:root{--bg:#06111b;--panel:#0b1722;--gold:#e8b54f;--gold2:#ffd77c;--text:#f7f2e8;--muted:#9ba7b3;--red:#7b1820;--blue:#153d76}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#10202c 0,#06111b 42%,#03080d 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
button,input{font:inherit}.app{max-width:720px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.screen{display:none}.screen.active{display:block}.brand{text-align:center;padding:48px 0 30px}.brand .mark{font-size:70px}.brand h1{font-size:64px;margin:4px;color:var(--gold);text-shadow:0 2px 18px #8a5a1433}.brand p{color:#d8c8a7}
.card{background:linear-gradient(180deg,#0d1923,#09131c);border:1px solid #a77a32;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 10px 30px #0005}
.btn{width:100%;border:1px solid #9e793c;border-radius:13px;padding:15px;margin:7px 0;background:#101a22;color:#fff;font-weight:700}.btn.gold{background:linear-gradient(#ffd477,#c98b27);color:#191006;border:0}.btn.red{background:var(--red)}.btn.blue{background:var(--blue)}
h2{text-align:center}label{display:block;color:var(--gold2);margin:14px 3px 6px}.input{width:100%;padding:14px;border-radius:12px;border:1px solid #53606b;background:#101b24;color:white}
.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.cat{min-height:92px;padding:8px;border:1px solid #48535b;border-radius:12px;background:#101820;color:#eee}.cat.sel{border:2px solid var(--gold);background:#211b11}.counter{text-align:center;color:var(--gold);font-weight:800;margin:8px}
.scorebar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:12px}.teamScore{border-radius:12px;padding:10px;text-align:center;font-weight:800}.teamScore.red{background:#50141b;border:1px solid #9e3039}.teamScore.blue{background:#102f5c;border:1px solid #315e9c}.logo{text-align:center;color:var(--gold);font-size:22px}
.board{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.categoryBox{border:1px solid #a77a32;border-radius:14px;padding:8px;background:#09131c}.categoryBox h3{text-align:center;font-size:15px;min-height:38px;margin:4px}.points{display:grid;grid-template-columns:1fr 1fr;gap:5px}.point{padding:10px 3px;border:1px solid #71582d;border-radius:8px;background:#101820;color:var(--gold);font-weight:900}.point.used{opacity:.25;text-decoration:line-through}
.question{font-size:25px;line-height:1.7;text-align:center;padding:24px 8px}.timer{width:126px;height:126px;border:8px solid #b92c34;border-radius:50%;display:grid;place-items:center;margin:20px auto;font-size:30px;font-weight:900}.timer.steal{border-color:#3477c8}.answer{text-align:center;font-size:28px;color:var(--gold2);font-weight:900;padding:18px}.hidden{display:none}.small{color:var(--muted);text-align:center}.winner{text-align:center;padding:35px 0}.trophy{font-size:76px}.winnerName{font-size:34px;color:var(--gold);font-weight:900}.topline{display:flex;justify-content:space-between;align-items:center}.badge{color:var(--gold);font-weight:800}
@media(max-width:390px){.categories{grid-template-columns:repeat(2,1fr)}.brand h1{font-size:54px}}
</style>
</head>
<body><main class="app">
<section id="home" class="screen active"><div class="brand"><div class="mark">🏮</div><h1>المجلس</h1><p>مسابقة المعرفة</p></div><button class="btn gold" onclick="show('teams')">⚔️ ابدأ مجلس جديد</button><div class="card small">النسخة التجريبية • تعمل مباشرة على الآيفون</div></section>

<section id="teams" class="screen"><h2>أسماء الفريقين</h2><div class="card"><label>الفريق الأول</label><input id="t1" class="input" value="فريق فهد"><label>الفريق الثاني</label><input id="t2" class="input" value="فريق مشعل"></div><button class="btn gold" onclick="toCategories()">التالي</button></section>

<section id="cats" class="screen"><div class="topline"><h2>اختيار الفئات</h2><span id="cc" class="badge">0 / 6</span></div><p class="small">اختر 6 فئات</p><div id="catGrid" class="categories"></div><button id="startBtn" class="btn gold" disabled onclick="draw()">ابدأ اللعبة</button></section>

<section id="draw" class="screen"><h2>القرعة</h2><div class="card winner"><div class="trophy">🎲</div><p>الفريق الذي يبدأ هو</p><div id="starter" class="winnerName"></div></div><button class="btn gold" onclick="startGame()">ابدأ المباراة</button></section>

<section id="boardScreen" class="screen"><div class="logo">المجلس</div><div class="scorebar"><div id="s2" class="teamScore red"></div><div>⚔️</div><div id="s1" class="teamScore blue"></div></div><div id="board" class="board"></div></section>

<section id="questionScreen" class="screen"><div class="topline"><span id="qCat" class="badge"></span><span id="qPts" class="badge"></span></div><div id="qText" class="question"></div><div id="timer" class="timer">00:30</div><p id="turnText" class="small"></p><button id="answerBtn" class="btn" onclick="reveal()">👁 إظهار الجواب</button><div id="answerArea" class="hidden"><div class="small">الإجابة الصحيحة</div><div id="answer" class="answer"></div><p class="small">من حصل على النقاط؟</p><button id="give1" class="btn blue" onclick="award(1)"></button><button id="give2" class="btn red" onclick="award(2)"></button><button class="btn" onclick="award(0)">لا أحد</button></div></section>

<section id="result" class="screen"><div class="winner"><div class="trophy">🏆</div><p>الفائز</p><div id="winnerName" class="winnerName"></div><div id="finalScores" class="card"></div></div><button class="btn gold" onclick="location.reload()">مجلس جديد</button></section>
</main>
<script>
const categories=["معلومات عامة","تاريخ","تاريخ إسلامي","قصص الأنبياء","قصص القرآن","جغرافيا","أعلام دول","نشيد وطني","من هو اللاعب","مسيرة لاعب","النادي المشترك","الدوري الإنجليزي","دوري الأبطال","كأس العالم","تشكيلات فرق","عالم الحيوان","صحح الخطأ","معارك وحروب","خمن الدولة","السيرة النبوية","من سجل الهدف"];
const samples={
"معلومات عامة":["ما العنصر الكيميائي الذي رمزه Fe؟","الحديد"],
"تاريخ":["أي حضارة بنت مدينة ماتشو بيتشو؟","حضارة الإنكا"],
"تاريخ إسلامي":["من أول الخلفاء الراشدين؟","أبو بكر الصديق"],
"قصص الأنبياء":["أي نبي ابتلعه الحوت؟","يونس عليه السلام"],
"قصص القرآن":["في أي سورة وردت قصة أصحاب الكهف؟","سورة الكهف"],
"جغرافيا":["ما عاصمة أستراليا؟","كانبرا"],
"أعلام دول":["أي دولة علمها ورقة قيقب حمراء؟","كندا"],
"نشيد وطني":["ما الدولة التي يسمى نشيدها لا مارسييز؟","فرنسا"],
"من هو اللاعب":["من اللاعب الملقب بالظاهرة؟","رونالدو نازاريو"],
"مسيرة لاعب":["لعب لأياكس ويوفنتوس وإنتر وبرشلونة وميلان وباريس، من هو؟","زلاتان إبراهيموفيتش"],
"النادي المشترك":["اذكر لاعبًا لعب لريال مدريد ومانشستر يونايتد.","كريستيانو رونالدو"],
"الدوري الإنجليزي":["أي نادٍ حقق أول لقب في حقبة البريميرليغ 1992-93؟","مانشستر يونايتد"],
"دوري الأبطال":["من فاز بدوري أبطال أوروبا 1999؟","مانشستر يونايتد"],
"كأس العالم":["من كان قائد إيطاليا عند الفوز بكأس العالم 2006؟","فابيو كانافارو"],
"تشكيلات فرق":["من كان حارس إسبانيا الأساسي في نهائي كأس العالم 2010؟","إيكر كاسياس"],
"عالم الحيوان":["ما أكبر حيوان حي على الأرض؟","الحوت الأزرق"],
"صحح الخطأ":["صحح: فازت الأرجنتين بكأس العالم 2014.","ألمانيا فازت بكأس العالم 2014"],
"معارك وحروب":["في أي عام انتهت الحرب العالمية الثانية؟","1945"],
"خمن الدولة":["دولة أوروبية عاصمتها لشبونة، ما هي؟","البرتغال"],
"السيرة النبوية":["إلى أي مدينة كانت الهجرة النبوية؟","المدينة المنورة"],
"من سجل الهدف":["من سجل هدف إسبانيا في نهائي كأس العالم 2010؟","أندريس إنييستا"]
};
let selected=[],team1="",team2="",score1=0,score2=0,current=null,timerId=null,time=30,steal=false,used=0;
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)}
function toCategories(){team1=t1.value.trim()||"الفريق الأول";team2=t2.value.trim()||"الفريق الثاني";renderCats();show('cats')}
function renderCats(){catGrid.innerHTML="";categories.forEach(c=>{let b=document.createElement('button');b.className='cat'+(selected.includes(c)?' sel':'');b.textContent=c;b.onclick=()=>{if(selected.includes(c))selected=selected.filter(x=>x!==c);else if(selected.length<6)selected.push(c);renderCats()};catGrid.appendChild(b)});cc.textContent=selected.length+" / 6";startBtn.disabled=selected.length!==6}
function draw(){starter.textContent=Math.random()<.5?team1:team2;show('draw')}
function startGame(){renderBoard();updateScores();show('boardScreen')}
function renderBoard(){board.innerHTML="";selected.forEach((c,ci)=>{let box=document.createElement('div');box.className='categoryBox';box.innerHTML='<h3>'+c+'</h3><div class="points"></div>';let p=box.querySelector('.points');[100,100,300,300,500,500].forEach((v,qi)=>{let b=document.createElement('button');b.className='point';b.textContent=v;b.dataset.used='0';b.onclick=()=>openQuestion(c,v,b,ci,qi);p.appendChild(b)});board.appendChild(box)})}
function openQuestion(cat,pts,btn,ci,qi){if(btn.dataset.used==='1')return;current={cat,pts,btn};qCat.textContent=cat;qPts.textContent=pts+" نقطة";let base=samples[cat]||["سؤال تجريبي","إجابة تجريبية"];qText.textContent=base[0];answer.textContent=base[1];answerArea.classList.add('hidden');answerBtn.classList.remove('hidden');steal=false;time=30;timer.classList.remove('steal');turnText.textContent="دور "+starter.textContent;show('questionScreen');runTimer()}
function runTimer(){clearInterval(timerId);paintTimer();timerId=setInterval(()=>{time--;paintTimer();if(time<=0){clearInterval(timerId);if(!steal){steal=true;time=15;timer.classList.add('steal');let other=starter.textContent===team1?team2:team1;turnText.textContent="انتقل السؤال إلى "+other;runTimer()}else reveal()}},1000)}
function paintTimer(){timer.textContent="00:"+String(time).padStart(2,'0')}
function reveal(){clearInterval(timerId);answerArea.classList.remove('hidden');answerBtn.classList.add('hidden');give1.textContent=team1+" +"+current.pts;give2.textContent=team2+" +"+current.pts}
function award(n){if(n===1)score1+=current.pts;if(n===2)score2+=current.pts;current.btn.dataset.used='1';current.btn.classList.add('used');current.btn.textContent='✓';used++;updateScores();if(used>=36)finish();else show('boardScreen')}
function updateScores(){s1.textContent=team1+" "+score1;s2.textContent=team2+" "+score2}
function finish(){let w=score1===score2?"تعادل":score1>score2?team1:team2;winnerName.textContent=w;finalScores.innerHTML="<b>"+team1+": "+score1+"</b><br><br><b>"+team2+": "+score2+"</b>";show('result')}
</script></body></html>
